server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # O HTML precisa ser revalidado sempre — é ele que aponta para o nome
    # (com hash) do pacote JS/CSS atual. Sem isso, o navegador pode continuar
    # servindo um index.html antigo do cache, referenciando um build antigo.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
