server {
    listen 80;
    server_name _;

    # DNS embutido do Docker. Sem isso, o nginx resolve "backend"/"frontend"
    # uma única vez ao iniciar e guarda o IP em cache — depois de um deploy
    # que recria esses containers com IP novo, o nginx continua batendo no
    # IP antigo e retorna 502. Usar variável no proxy_pass força reconsulta
    # a cada requisição (respeitando o "valid" abaixo), então cada deploy
    # é percebido automaticamente, sem precisar reiniciar o nginx na mão.
    resolver 127.0.0.11 valid=10s;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /api/ {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        alias /app/staticfiles/;
    }

    location /media/ {
        alias /app/media/;
    }

    location / {
        set $frontend_upstream http://frontend:80;
        proxy_pass $frontend_upstream;
        proxy_set_header Host $host;
    }
}
